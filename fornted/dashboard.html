<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | AgroGuide</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* আগের স্ট্রাকচার ঠিক রেখে প্রফেশনাল থিম */
        body {
            margin: 0;
            background-color: #f0f4f0; /* হালকা ঘাস রঙ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dashboard-container { 
            display: flex; 
            min-height: 100vh; 
        }

        /* Sidebar Theme */
        .sidebar { 
            width: 260px; 
            background: linear-gradient(180deg, #1b3d18 0%, #2d5a27 100%); 
            color: white; 
            padding: 30px 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            font-size: 24px;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .sidebar p {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .sidebar nav a {
            display: block;
            color: #d1e7d1;
            text-decoration: none;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: 500;
        }

        .sidebar nav a:hover {
            background: #4CAF50;
            color: white;
            transform: translateX(5px);
        }

        /* Main Content Theme */
        .main-content { 
            flex: 1; 
            padding: 40px; 
            background: url('https://www.transparenttextures.com/patterns/leaf.png'); /* হালকা টেক্সচার */
        }

        h1 {
            color: #2d5a27;
            font-size: 2rem;
            margin-bottom: 30px;
            border-left: 6px solid #2d5a27;
            padding-left: 15px;
        }

        /* Card Box Styling */
        .card-box { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 25px; 
        }

        .quick-card { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 15px; 
            text-align: center; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .quick-card:hover { 
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(45, 90, 39, 0.15);
            background: #f9fff9;
        }

        .quick-card h3 {
            color: #2d5a27;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .quick-card p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Market Trends Grid */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #2d5a27; border-radius: 10px; }

    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2><i class="fas fa-seedling"></i> AgroGuide</h2>
            <p><i class="fas fa-user-circle"></i> Welcome Back</p>
            <hr style="opacity: 0.2; margin: 20px 0;">
            <nav style="flex-direction: column; background: none; padding: 0;">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="pages/disease/upload.html"><i class="fas fa-microscope"></i> AI Disease Check</a>
                <a href="pages/guide.html"><i class="fas fa-book-open"></i> Farming Guide</a>
                <a href="#" style="color: #ff9f9f;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h1>Farmer Dashboard</h1>
            
            <div class="card-box">
                <div class="quick-card" onclick="location.href='pages/disease/upload.html'">
                    <h3><i class="fas fa-camera-retro"></i> AI Check</h3>
                    <p>Detect crop diseases instantly</p>
                </div>
                <div class="quick-card">
                    <h3><i class="fas fa-wheat-awn"></i> My Crops</h3>
                    <p>Manage your product listings</p>
                </div>
                <div class="quick-card">
                    <h3><i class="fas fa-wallet"></i> Earnings</h3>
                    <p>Track your sales & profit</p>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 50px;">
                <h3 style="color: #2d5a27; font-size: 1.5rem;"><i class="fas fa-chart-line"></i> Live Market Trends</h3>
                <span style="background: #2d5a27; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px;">Live Data</span>
            </div>
            
            <div id="market-price-container" class="price-grid">
                </div>
        </div>
    </div>

    <script src="assets/js/market.js"></script>
</body>
</html>
