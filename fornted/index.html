<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgroGuide | Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* এগ্রিকালচারাল থিম অ্যাড করার জন্য কাস্টম স্টাইল */
        body {
            /* হালকা মাটির রঙ বা নেচারাল ব্যাকগ্রাউন্ড */
            background-color: #f9fbf9; 
            background-image: url('https://www.transparenttextures.com/patterns/ leaf.png'); /* হালকা পাতার টেক্সচার */
            background-attachment: fixed;
        }

        header {
            /* হিরো সেকশনে একটি সুন্দর কৃষি ক্ষেতের ছবি */
            background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), 
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            border-bottom: 5px solid #2d5a27;
        }

        h1, h2, h3 {
            color: #1b3d18;
        }

        .price-grid {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px); /* মডার্ন গ্লাস ইফেক্ট */
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* কার্ডের ওপর মাউস নিলে সুন্দর ইফেক্ট */
        .price-card:hover {
            transform: translateY(-5px);
            border: 1px solid #4CAF50;
            transition: 0.3s;
        }

        /* স্ক্রলবার কাস্টমাইজেশন */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d5a27;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav style="background: #2d5a27; display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; color: white;">
        <h1>AgroGuide</h1>
        <div>
            <a href="pages/auth/login.html" style="color:white; text-decoration:none; margin-right:20px;">Login</a>
            <button class="btn-primary" onclick="location.href='pages/auth/register.html'" style="cursor:pointer;">Register</button>
        </div>
    </nav>

    <header style="text-align:center; padding: 80px 20px;">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px;">Empowering Farmers with Technology</h2>
        <p style="font-size: 1.2rem; color: #444;">Direct Market Access & AI Disease Detection</p>
    </header>

    <main>
        <section style="padding: 40px 5%;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 30px;">
                <h3 style="border-left: 5px solid #2d5a27; padding-left: 15px; font-size: 1.5rem;">Market Price (আজকের বাজার দর)</h3>
                
                <div class="filter-buttons" style="margin-top: 10px;">
                    <button class="btn-filter active" onclick="loadMarketPrices('all')">সব</button>
                    <button class="btn-filter" onclick="loadMarketPrices('grain')">চাল/ডাল</button>
                    <button class="btn-filter" onclick="loadMarketPrices('veg')">সবজি</button>
                    <button class="btn-filter" onclick="loadMarketPrices('fruit')">ফল</button>
                    <button class="btn-filter" onclick="loadMarketPrices('meat')">মাংস/ডিম</button>
                    <button class="btn-filter" onclick="loadMarketPrices('fish')">মাছ</button>
                    <button class="btn-filter" onclick="loadMarketPrices('spice')">মসলা ও অন্যান্য</button>
                </div>
            </div>

            <div style="margin-bottom: 40px; text-align: center;">
                <div style="position: relative; display: inline-block; width: 80%;">
                    <i class="fas fa-search" style="position: absolute; left: 15px; top: 15px; color: #2d5a27;"></i>
                    <input type="text" id="market-search" placeholder="পণ্য খুঁজুন (যেমন: আলু, চাল)..." 
                        onkeyup="searchMarket()" 
                        style="width: 100%; padding: 12px 12px 12px 45px; border-radius: 25px; border: 2px solid #2d5a27; outline: none; font-size: 16px; background: rgba(255,255,255,0.9);">
                </div>
            </div>
            
            <div id="market-price-container" class="price-grid">
                </div>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; background: #1b3d18; color: white; margin-top: 50px;">
        <p>&copy; 2026 AgroGuide - আপনার কৃষির ডিজিটাল সমাধান</p>
    </footer>

    <script src="assets/js/market.js"></script>
</body>
</html>
