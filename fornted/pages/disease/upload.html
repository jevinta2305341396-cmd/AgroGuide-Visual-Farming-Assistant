<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Image | AgroGuide</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body style="text-align:center; padding-top: 50px;">
    <h2>Visual Farming Assistant</h2>
    <p>Upload a clear photo of the infected leaf or crop</p>

    <div style="max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" style="margin-bottom: 20px;">
        <br>
        <img id="image-preview" src="#" alt="Preview" style="max-width: 100%; display: none; margin-bottom: 20px; border-radius: 10px;">
        <br>
        <button class="btn-primary" onclick="uploadToAI()">Analyze Health</button>
        <p id="upload-status" style="margin-top: 15px; font-weight: bold; color: var(--primary-green);"></p>
    </div>

    <script src="../../assets/js/ai-handler.js"></script>
</body>
</html>
