<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | AgroGuide</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: white; padding: 40px; border-radius: 10px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: var(--primary-green);">Join AgroGuide</h2>
        <form id="register-form">
            <input type="text" placeholder="Full Name" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;">
            <input type="email" placeholder="Email Address" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;">
            <select style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;">
                <option value="farmer">I am a Farmer</option>
                <option value="buyer">I am a Buyer</option>
            </select>
            <input type="password" placeholder="Create Password" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;">
            <button type="submit" class="btn-primary" style="width: 100%;">Sign Up</button>
        </form>
    </div>
</body>
</html>
