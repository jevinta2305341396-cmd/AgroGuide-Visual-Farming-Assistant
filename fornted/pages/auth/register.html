<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | AgroGuide</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
             background: linear-gradient(rgba(45, 90, 39, 0.75), rgba(27, 61, 24, 0.75)), 
             url('https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1500&q=80'); 
             background-size: cover; background-position: center; font-family: 'Segoe UI', sans-serif;">

    <div style="background: rgba(255, 255, 255, 0.92); padding: 40px; border-radius: 20px; width: 400px; 
                box-shadow: 0 15px 35px rgba(0,0,0,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); margin: 20px;">
        
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="background: #2d5a27; width: 60px; height: 60px; border-radius: 50%; display: flex; 
                        justify-content: center; align-items: center; margin: 0 auto 10px;">
                <span style="color: white; font-size: 30px;">🌾</span>
            </div>
            <h2 style="margin: 0; color: #2d5a27; font-size: 1.8rem;">Join AgroGuide</h2>
            <p style="font-size: 0.9rem; color: #555;">কৃষি বিপ্লবে যোগ দিন এবং স্মার্ট সেবা নিন</p>
        </div>

        <form id="register-form">
            <div style="margin-bottom: 12px;">
                <label style="font-weight: 600; color: #333; font-size: 0.9rem;">Full Name</label>
                <input type="text" placeholder="আপনার নাম লিখুন" required 
                       style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; outline: none;">
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-weight: 600; color: #333; font-size: 0.9rem;">Email Address</label>
                <input type="email" placeholder="email@example.com" required 
                       style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; outline: none;">
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-weight: 600; color: #333; font-size: 0.9rem;">User Type</label>
                <select style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; outline: none; background: white;">
                    <option value="farmer">আমি একজন কৃষক (Farmer)</option>
                    <option value="buyer">আমি একজন ক্রেতা (Buyer)</option>
                    <option value="expert">কৃষি বিশেষজ্ঞ (Expert)</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-weight: 600; color: #333; font-size: 0.9rem;">Create Password</label>
                <input type="password" placeholder="••••••••" required 
                       style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; outline: none;">
            </div>

            <button type="submit" class="btn-primary" 
                    style="width: 100%; padding: 14px; font-weight: bold; background-color: #2d5a27; color: white; 
                           border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 10px rgba(45,90,39,0.3);">
                SIGN UP NOW
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: #444;">
            <span>Already have an account? 
                <a href="login.html" style="color: #2d5a27; font-weight: bold; text-decoration: none;">Login Here</a>
            </span>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
</body>
</html>
