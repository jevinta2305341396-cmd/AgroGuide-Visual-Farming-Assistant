<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | AgroGuide</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
             background: linear-gradient(rgba(45, 90, 39, 0.7), rgba(27, 61, 24, 0.7)), 
             url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1500&q=80'); 
             background-size: cover; background-position: center; font-family: 'Segoe UI', sans-serif;">

    <div style="background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 20px; width: 380px; 
                box-shadow: 0 15px 35px rgba(0,0,0,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3);">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="background: #2d5a27; width: 60px; height: 60px; border-radius: 50%; display: flex; 
                        justify-content: center; align-items: center; margin: 0 auto 10px;">
                <span style="color: white; font-size: 30px;">🌱</span>
            </div>
            <h2 style="margin: 0; color: #2d5a27; font-size: 1.8rem;">Welcome</h2>
            <p style="font-size: 0.9rem; color: #555;">আপনার কৃষি ড্যাশবোর্ডে লগইন করুন</p>
        </div>
        
        <form id="login-form">
            <div style="margin-bottom: 15px;">
                <label style="font-weight: 600; color: #333;">Username</label>
                <input type="text" id="username" placeholder="Enter username" required 
                       style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px; 
                              box-sizing: border-box; outline: none; transition: 0.3s; background: white;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-weight: 600; color: #333;">Password</label>
                <input type="password" id="password" placeholder="••••••••" required 
                       style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px; 
                              box-sizing: border-box; outline: none; transition: 0.3s; background: white;">
            </div>
            
            <button type="submit" class="btn-primary" 
                    style="width: 100%; padding: 14px; font-weight: bold; background-color: #2d5a27; color: white; 
                           border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s;">
                LOGIN
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: #444;">
            <a href="forget.html" style="color: #4CAF50; text-decoration: none; font-weight: 500;">Forgot Password?</a>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <span>Don't have an account? 
                <a href="register.html" style="color: #2d5a27; font-weight: bold; text-decoration: none;">Register Now</a>
            </span>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
</body>
</html>
